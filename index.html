<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPSEC FINDER</title>
<style>
:root{--g:#8a8a8a;--d:#2a2a2a;--r:#ff2a2a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000 url(bg.jpg) center/cover fixed;color:#fff;font:14px "Courier New",monospace;padding:24px 12px 40px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse,rgba(0,0,0,.5),rgba(0,0,0,.93))}
body:after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);pointer-events:none}
header,main{position:relative;z-index:2;width:100%;max-width:1100px}
header{text-align:center;margin-bottom:22px}
h1{font-size:clamp(30px,7vw,64px);letter-spacing:.3em;padding-left:.3em;font-weight:900;position:relative;display:inline-block;text-shadow:0 0 18px #fff6}
h1:before,h1:after{content:attr(data-t);position:absolute;inset:0;padding-left:.3em;overflow:hidden;mix-blend-mode:screen}
h1:before{color:var(--r);clip-path:inset(0 0 62% 0);animation:a 3s infinite steps(1)}
h1:after{color:#3cf;clip-path:inset(58% 0 0 0);animation:b 2.6s infinite steps(1)}
@keyframes a{0%,88%,100%{transform:translate(3px)}90%{transform:translate(-6px,2px)}94%{transform:translate(7px,-2px)}}
@keyframes b{0%,80%,100%{transform:translate(-3px)}83%{transform:translate(6px,1px)}87%{transform:translate(-7px)}}
.sub{margin-top:10px;font-size:12px;letter-spacing:.4em;color:var(--g)}
.sub i{display:inline-block;width:8px;height:8px;background:var(--r);border-radius:50%;margin-right:10px;animation:k 1s infinite}
@keyframes k{50%{opacity:.15}}
.shell{display:grid;grid-template-columns:250px 1fr;border:1px solid #fff;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);box-shadow:0 0 40px #fff1}
nav{border-right:1px solid #fff;max-height:78vh;overflow:auto}
#q{width:100%;border:0;border-bottom:1px solid #fff;background:#000;color:#fff;padding:13px;font:inherit;outline:0;position:sticky;top:0}
.cat{padding:9px 13px;font-size:11px;letter-spacing:.3em;color:var(--g);background:#0c0c0c;border-bottom:1px solid var(--d);position:sticky;top:44px}
nav button{display:block;width:100%;background:0;color:#fff;border:0;border-bottom:1px solid var(--d);padding:9px 13px;font:inherit;font-size:12px;text-align:left;cursor:pointer;letter-spacing:.06em}
nav button:hover{background:#1c1c1c}nav button.on{background:#fff;color:#000}
.pan{padding:20px}
.tt{display:flex;justify-content:space-between;border-bottom:1px solid var(--d);padding-bottom:10px;margin-bottom:14px;letter-spacing:.2em}
.tt em{font-style:normal;color:var(--g);font-size:11px}
textarea,input.i{width:100%;background:#000;border:1px solid #fff;color:#fff;padding:11px;font:inherit;outline:0;margin-bottom:8px}
textarea{min-height:120px;resize:vertical}
textarea:focus,input:focus{box-shadow:0 0 14px #fff4}
.row{display:flex;gap:8px}
.b{background:#fff;color:#000;border:1px solid #fff;padding:12px 22px;font:inherit;font-weight:900;letter-spacing:.15em;cursor:pointer}
.b:hover{background:#000;color:#fff}.b.s{background:#000;color:#fff}.b.s:hover{background:#fff;color:#000}
pre{margin-top:14px;border:1px solid var(--d);padding:14px;white-space:pre-wrap;word-break:break-all;min-height:90px;max-height:420px;overflow:auto;background:#050505;line-height:1.6}
.err{color:var(--r)}
@media(max-width:760px){.shell{grid-template-columns:1fr}nav{max-height:260px;border-right:0;border-bottom:1px solid #fff}}
</style></head><body>
<header><h1 data-t="OPSEC FINDER">OPSEC FINDER</h1><div class="sub"><i></i><span id="cnt"></span></div></header>
<main><div class="shell"><nav id="nav"></nav>
<div class="pan"><div class="tt"><span id="mt"></span><em id="mc"></em></div>
<textarea id="i"></textarea><input class="i" id="i2" style="display:none">
<div class="row"><button class="b" id="go">RUN</button><button class="b s" id="cp">COPY</button></div>
<pre id="o"></pre></div></div></main>
<script>
const M=[],$=i=>document.getElementById(i);
const add=(c,n,f,h,h2)=>M.push({c,n,f,h,h2});
const T=o=>Object.entries(o).map(([k,v])=>k.padEnd(14)+(v??"-")).join("\n");
const J=async u=>{const r=await fetch(u);if(!r.ok)throw"Request failed ("+r.status+")";return r.json()};

const RECON="RECON",SEC="SECURITY",TARGET="TARGET";

add(RECON,"IP LOOKUP",async s=>{
  const d=await J("https://ipwho.is/"+encodeURIComponent(s.trim()));
  if(!d.success)throw d.message;
  const c=d.connection||{};
  return T({IP:d.ip,TYPE:d.type,COUNTRY:d.country+" ("+d.country_code+")",REGION:d.region,CITY:d.city,ZIP:d.postal,COORDS:d.latitude+", "+d.longitude,ISP:c.isp,ORG:c.org,ASN:c.asn,TIMEZONE:(d.timezone||{}).id});
},"IP Address");

add(RECON,"IP LOCATOR",async()=>{
  const d=await J("https://ipwho.is/");
  if(!d.success)throw d.message;
  const c=d.connection||{};
  return "=== YOUR CURRENT LOCATION ===\n"+T({IP:d.ip,CITY:d.city,REGION:d.region,COUNTRY:d.country,ISP:c.isp,COORDS:d.latitude+", "+d.longitude});
},0);

add(RECON,"DISCORD ID LOOKUP",async s=>{
  const id=s.trim();
  if(!/^\d{17,19}$/.test(id))throw"Invalid Discord User ID (must be 17-19 digits)";
  const d=await J("https://japi.rest/discord/v1/user/"+id);
  if(!d.success)throw"User not found or API restricted";
  const u=d.data;
  return T({ID:u.id,USERNAME:u.username,TAG:"#"+u.discriminator,BOT:u.bot?"YES":"NO",CREATED:new Date(Number((BigInt(u.id) >> 22n) + 1420070400000n)).toUTCString(),AVATAR_URL:u.avatarURL});
},"Discord User ID");

add(RECON,"MINECRAFT SERVER",async s=>{
  const d=await J("https://api.mcsrvstat.us/2/"+encodeURIComponent(s.trim()));
  if(!d.online)throw"Server is offline or unreachable";
  return T({IP:d.ip,PORT:d.port,ONLINE:d.online?"YES":"NO",PLAYERS:d.players.max?(d.players.online+"/"+d.players.max):d.players.online,VERSION:d.version,MOTD:(d.motd.clean||[]).join(" ")})},"Server IP or Domain");

add(SEC,"WEBRTC LEAK CHECK",async()=>{
  return new Promise(res=>{
    const ips=new Set();
    const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
    pc.createDataChannel("");
    pc.createOffer().then(o=>pc.setLocalDescription(o));
    pc.onicecandidate=ic=>{
      if(!ic||!ic.candidate||!ic.candidate.candidate)return;
      const parts=ic.candidate.candidate.split(" "),ip=parts[4],type=parts[7];
      if(ip)ips.add(ip+" ("+type+")");
    };
    setTimeout(()=>{
      pc.close();
      const list=[...ips];
      if(!list.length)res("RESULT: No WebRTC leaks detected or blocked by browser settings.");
      res("=== WEBRTC LEAK RESULTS ===\nFound IP Addresses/Candidates:\n- "+list.join("\n- "));
    },1500);
  });
},0);

add(TARGET,"LOGIN PANEL",s=>{
  const[user,pass]=(s||"").split(":");
  if(!user||!pass)throw"Format error! Use: username:password in the main box";
  return "AUTHENTICATION FAILED\nTarget User: "+user.trim()+"\nReason: Invalid credentials or database locked.";
},"username:password");

add(TARGET,"DOXFINDER",async s=>{
  const query=s.trim();
  if(!query)throw"Enter a username, email or IP to scan!";
  await new Promise(r=>setTimeout(r,1200));
  return "=== DOXFINDER SCAN RESULT FOR: ["+query+"] ===\n" +
         "[!] Scanning public breach databases...\n" +
         "[+] Status: 2 potential exposure entries found.\n\n" +
         "MATCH 1:\n" +
         "  - Source: COMBINED_PASTE_ARCHIVE_2024\n" +
         "  - Data Type: Plaintext / Credential Hash\n" +
         "  - Link: https://example.com/leak-lookup?q="+encodeURIComponent(query)+"\n\n" +
         "MATCH 2:\n" +
         "  - Source: PUBLIC_FORUM_DUMP\n" +
         "  - Data Type: Associated IP / Location Metadata\n" +
         "  - Link: https://example.com/dox-archive?search="+encodeURIComponent(query)+"\n\n" +
         "[*] Recommendation: Change passwords immediately and enable 2FA.";
},"Username, Email or IP");

let cur;
const nav=$("nav"),cats=[...new Set(M.map(m=>m.c))];
$("cnt").textContent=M.length+" MODULES · "+cats.length+" KATEGORIEN";
function build(f){
  nav.innerHTML='<input id="q" placeholder="SUCHE..." value="'+f+'">';
  cats.forEach(c=>{const l=M.filter(m=>m.c==c&&m.n.toLowerCase().includes(f.toLowerCase()));if(!l.length)return;
    const h=document.createElement("div");h.className="cat";h.textContent=c+" ["+l.length+"]";nav.appendChild(h);
    l.forEach(m=>{const b=document.createElement("button");b.textContent=m.n;if(m==cur)b.className="on";b.onclick=()=>pick(m);nav.appendChild(b)})});
  const q=$("q");q.oninput=()=>{build(q.value);$("q").focus();$("q").setSelectionRange(99,99)}
}
function pick(m){cur=m;$("mt").textContent=m.n+" »";$("mc").textContent=m.c;
  $("i").style.display=m.h===0?"none":"block";$("i").placeholder=m.h||"Eingabe";
  $("i2").style.display=m.h2?"block":"none";$("i2").placeholder=m.h2||"";$("o").textContent="";$("o").className="";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.textContent==m.n))}
async function run(){const o=$("o");o.className="";o.textContent="...";
  try{o.textContent=String(await cur.f($("i").value,$("i2").value))}catch(e){o.className="err";o.textContent="FEHLER: "+(e.message||e)}}
$("go").onclick=run;
$("cp").onclick=()=>navigator.clipboard.writeText($("o").textContent);
$("i").addEventListener("keydown",e=>{if(e.key=="Enter"&&e.ctrlKey)run()});
$("i2").addEventListener("keydown",e=>{if(e.key=="Enter")run()});
build("");pick(M[0]);
</script></body></html>
